name: ci

# Round-14 — the push trigger pointed at `main`, but the repository's
# default branch is `Main-BreakFix` and no `main` branch exists, so
# the push trigger never fired; CI only ever ran on pull_request
# events. Cover the default branch and working branches so every
# push gets the full gate set (the docker-publish workflow already
# builds claude/** pushes — they should be validated too).
on:
  pull_request:
  push:
    branches:
      - Main-BreakFix
      - "claude/**"

jobs:
  forbidden-tokens:
    name: Forbidden tokens grep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run forbidden-tokens scan
        run: bash scripts/check-forbidden-tokens.sh

  vitest:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx vitest run

  typecheck:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit

  # Round-11 §2D — integration tests against a live Postgres +
  # Mailpit. Runs every spec under tests/integration/ so the
  # write-path code (state machine, dispatchEmailEvent, audit
  # writers, etc.) is exercised end-to-end. Skipped if the matrix
  # variable INTEGRATION is "false" so contributors can opt out
  # locally.
  integration:
    name: Integration (Postgres + Mailpit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: breakfix_ci
          POSTGRES_USER: bf
          POSTGRES_PASSWORD: bf
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bf -d breakfix_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: "postgresql://bf:bf@localhost:5432/breakfix_ci"
      AUTH_SESSION_SALT: "ci-test-salt"
      SMTP_HOST: "127.0.0.1"
      SMTP_PORT: "1025"
      EMAIL_TRANSPORT: "smtp"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Round-12 §1F — capture the migration log + assert it
      # actually applied. `prisma migrate deploy` exits 0 only when
      # every pending migration succeeds; piping through tee gives
      # the post-deploy verification script a file to grep.
      - name: Apply Prisma migrations
        run: |
          set -o pipefail
          npx prisma migrate deploy 2>&1 | tee migrate-deploy.log
          if grep -qE "Skipped|rolled back" migrate-deploy.log; then
            echo "::error::A migration was skipped or rolled back."
            exit 1
          fi
      - run: npm run db:seed:defaults
      - run: npm run test:integration

  # Round-12 §1E — Playwright route smoke + persona suite.
  # Chromium-only, runs against a live Next.js build. Postgres
  # service container holds the synthetic test fixture
  # (prisma/seed-test.ts).
  playwright:
    name: Playwright (route smoke + persona)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: breakfix_e2e
          POSTGRES_USER: bf
          POSTGRES_PASSWORD: bf
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bf -d breakfix_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: "postgresql://bf:bf@localhost:5432/breakfix_e2e"
      AUTH_SESSION_SALT: "ci-test-salt"
      NEXTAUTH_SECRET: "ci-test-secret-do-not-use-in-prod-32chars"
      NEXTAUTH_URL: "http://127.0.0.1:3000"
      PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3000"
      # storeFile() defaults to /app/data/attachments (the Docker
      # volume path), which isn't writable on a GitHub runner — the
      # photo-capture spec uploads a real file (Round-18 §4).
      ATTACHMENTS_DIR: "/tmp/breakfix-attachments"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Apply Prisma migrations
        run: |
          set -o pipefail
          npx prisma migrate deploy 2>&1 | tee migrate-deploy.log
      - run: npm run db:seed:test
      - run: npm run build
      - run: npm run e2e:install
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
