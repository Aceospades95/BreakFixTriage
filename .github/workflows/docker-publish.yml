name: Build and publish Docker image

# Builds the BreakFix Triage app image and pushes it to GitHub Container
# Registry on every push. The Unraid host pulls from ghcr.io using the
# `latest` tag by default.
#
# Round-14 — `latest` is now only tagged on the default branch
# (Main-BreakFix). Previously every claude/** push overwrote `latest`,
# meaning a working-branch push could change what production pulls
# before any review. Branch pushes still publish `sha-<short>` and
# `<branch-name>` tags, so a branch can be field-QA'd on the Unraid
# host by pointing the template at its branch tag explicitly.

on:
  push:
    branches:
      - main
      - "claude/**"
    paths-ignore:
      - "docs/**"
      - "unraid/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/aceospades95/breakfixtriage

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
