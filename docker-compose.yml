services:
  postgres:
    image: postgres:15-alpine
    container_name: breakfix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: breakfix
      POSTGRES_PASSWORD: breakfix
      POSTGRES_DB: breakfix
    ports:
      - "5432:5432"
    volumes:
      - breakfix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breakfix -d breakfix"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  breakfix_pgdata:
